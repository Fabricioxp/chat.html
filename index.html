<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galáxia do Amor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Container de textos flutuantes em 3D */
        #labels-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .3d-label {
            position: absolute;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 2px;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(255, 42, 116, 0.9), 0 0 15px rgba(255, 42, 116, 0.5);
            transform: translate(-50%, -50%);
            transition: opacity 0.3s;
            opacity: 0.8;
            font-family: Arial, sans-serif;
        }

        /* Variáveis idênticas às do vídeo */
        :root {
            --letter-love: 420px;
            --letter: rgba(15, 2, 7, 0.82);
        }

        /* Interface Principal (.Para_Ti) */
        .Para_Ti {
            position: absolute;
            width: 90%;
            max-width: 380px;
            height: var(--letter-love);
            background: var(--letter);
            border-radius: 24px;
            border: 2px solid #ff2a74;
            box-shadow: 0 0 35px rgba(255, 42, 116, 0.7), inset 0 0 15px rgba(255, 42, 116, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 35px 24px;
            color: #fff;
            text-align: center;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        .Para_Ti h1 {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ff6b8b, #ff8ebb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .image-container {
            width: 140px;
            height: 140px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .love-sticker {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(255, 126, 179, 0.6));
        }

        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 6px;
            color: #ff5e97;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 10px;
        }

        .poem-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #ffe3ed;
            margin: 15px 0;
            font-weight: 500;
        }

        /* Botão estilizado */
        .btn-iniciar {
            background: #ff2a74;
            border: none;
            color: white;
            padding: 12px 45px;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 0 20px #ff2a74;
            transition: all 0.3s ease;
        }

        .btn-iniciar:hover {
            background: #ff5e97;
            box-shadow: 0 0 30px #ff7eb3;
            transform: scale(1.05);
        }

        /* Botão de Coração Pulsante */
        .btn-next-heart {
            background: none;
            border: none;
            font-size: 2.2rem;
            cursor: pointer;
            color: #ff2a74;
            animation: pulse 1.4s infinite;
            margin-top: 10px;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #ff2a74); }
            50% { transform: scale(1.18); filter: drop-shadow(0 0 12px #ff2a74); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px #ff2a74); }
        }

        /* Efeito de sumir suave */
        .hidden-card {
            opacity: 0.05;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.9);
        }
    </style>
</head>
<body>

    <canvas id="galaxy-canvas"></canvas>

    <div id="labels-container"></div>

    <div class="Para_Ti" id="card-container">
        
        <div class="screen active" id="screen-init">
            <h1>Galaxy Love</h1>
            <div class="image-container">
                <svg viewBox="0 0 100 100" class="love-sticker" xmlns="http://www.w3.org/2000/svg">
                    <path d="M35,45 C30,30 45,30 45,45 C45,30 60,30 55,45 C52,60 35,70 35,70 C35,70 18,60 15,45 C12,30 27,30 27,45" fill="#fff"/>
                    <path d="M65,50 C61,37 73,37 73,50 C73,37 85,37 81,50 C78,62 65,70 65,70 C65,70 52,62 49,50 C46,37 58,37 58,50" fill="#ff7eb3"/>
                </svg>
            </div>
            <p class="subtitle">Amor</p>
            <button class="btn-iniciar" onclick="nextScreen(1)">INICIAR</button>
        </div>

        <div class="screen" id="screen-msg1">
            <h1>Amor da Minha Vida</h1>
            <div class="image-container">
                <svg viewBox="0 0 100 100" class="love-sticker">
                    <circle cx="33" cy="50" r="22" fill="#e60000"/>
                    <path d="M22,42 Q33,32 44,42 M22,50 Q33,62 44,50" stroke="#fff" stroke-width="2.5" fill="none"/>
                    <path d="M25,44 L30,48 M41,44 L36,48" stroke="#000" stroke-width="3"/>
                    <circle cx="66" cy="50" r="22" fill="#fff" stroke="#ffb3d1" stroke-width="2"/>
                    <path d="M58,46 Q61,48 62,46 M74,46 Q71,48 70,46" stroke="#000" stroke-width="3" fill="none"/>
                    <ellipse cx="66" cy="52" rx="3" ry="2" fill="#ff9900"/>
                    <path d="M72,34 L82,38 L76,44" fill="#ff0066"/>
                </svg>
            </div>
            <p class="poem-text">"Quanto mais o tempo passa, mais eu tenho certeza de que você é a minha galáxia inteira."</p>
            <button class="btn-next-heart" onclick="nextScreen(2)">❤️</button>
        </div>

        <div class="screen" id="screen-msg2">
            <h1>Você Me Encanta</h1>
            <div class="image-container">
                <svg viewBox="0 0 100 100" class="love-sticker">
                    <path d="M12,50 C12,20 88,20 88,50 C88,80 12,80 12,50 Z" fill="#ff7eb3"/>
                    <circle cx="35" cy="48" r="5" fill="#000"/><circle cx="65" cy="48" r="5" fill="#000"/>
                    <path d="M42,62 Q50,68 58,62" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                    <path d="M20,35 Q25,25 35,32 M80,35 Q75,25 65,32" stroke="#fff" stroke-width="3" fill="none"/>
                </svg>
            </div>
            <p class="poem-text">"Se eu pudesse escolher qualquer lugar do mundo para ser o meu lugar seguro... seria bem aí, do seu lado."</p>
            <button class="btn-next-heart" onclick="resetRoutine()">❤️</button>
        </div>

    </div>

    <script>
        // --- 1. TRANSIÇÃO DE TELAS INTERATIVAS ---
        const screens = [
            document.getElementById('screen-init'),
            document.getElementById('screen-msg1'),
            document.getElementById('screen-msg2')
        ];
        const cardContainer = document.getElementById('card-container');

        function nextScreen(index) {
            screens.forEach(s => s.classList.remove('active'));
            screens[index].classList.add('active');
            
            // Efeito do vídeo: O card some temporariamente para contemplar as estrelas e o buraco negro
            cardContainer.classList.add('hidden-card');
            setTimeout(() => {
                cardContainer.classList.remove('hidden-card');
            }, 2000); 
        }

        function resetRoutine() {
            nextScreen(0);
        }

        // --- 2. SISTEMA 3D DA GALÁXIA E PALAVRAS FLUTUANTES (THREE.JS) ---
        const canvas = document.getElementById('galaxy-canvas');
        const labelsContainer = document.getElementById('labels-container');
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 35;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Criando as Partículas do Coração/Buraco Negro
        const particleCount = 4500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const phases = [];
        const speeds = [];
        const radii = [];

        const colorsPalette = [
            new THREE.Color('#ff1493'), // Rosa Choque
            new THREE.Color('#ff2a74'), // Rosa do Vídeo
            new THREE.Color('#ff7eb3'), // Rosa Claro
            new THREE.Color('#3a0014')  // Fundo do Centro Escuro
        ];

        for (let i = 0; i < particleCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            phases.push(theta);
            speeds.push(0.4 + Math.random() * 1.2);
            
            // Distância em relação ao centro (cria o efeito de espiral/disco)
            const factor = 0.3 + Math.random() * 1.3;
            radii.push(factor);

            // Equação matemática clássica do formato de coração (Heart Curve 3D)
            const t = theta;
            const x = 16 * Math.pow(Math.sin(t), 3) * factor;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * factor;
            const z = (Math.random() - 0.5) * 5;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            // Mistura de cores baseada na proximidade com o centro do buraco negro
            const colorSelected = colorsPalette[Math.floor(Math.random() * colorsPalette.length)];
            colors[i * 3] = colorSelected.r;
            colors[i * 3 + 1] = colorSelected.g;
            colors[i * 3 + 2] = colorSelected.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.35,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // --- ADICIONANDO AS PALAVRAS FLUTUANTES EM PORTUGUÊS ---
        const wordList = [
            "TE AMO ❤️", "INFINITO 🚀", "AMOR ETERNO ✨", "MINHA VIDA 💖", 
            "PRA SEMPRE 🔐", "MEU MUNDO 🌍", "TE AMO ❤️", "INFINITO 🚀"
        ];
        
        const labelsData = [];

        // Cria os elementos HTML para cada palavra do vídeo
        wordList.forEach((text, index) => {
            const el = document.createElement('div');
            el.className = '3d-label';
            el.innerText = text;
            labelsContainer.appendChild(el);

            // Distribui as palavras em ângulos diferentes ao redor do coração
            const angle = (index / wordList.length) * Math.PI * 2;
            labelsData.push({
                element: el,
                angle: angle,
                distance: 12 + Math.random() * 6, // Distância do centro
                speed: 0.3 + Math.random() * 0.4,
                zOffset: (Math.random() - 0.5) * 5
            });
        });

        // Função para converter coordenadas 3D para pixels da tela (Projeção 2D)
        const tempV = new THREE.Vector3();
        function updateLabels(elapsedTime) {
            const widthHalf = window.innerWidth / 2;
            const heightHalf = window.innerHeight / 2;

            labelsData.forEach(label => {
                // Movimentação orbital matemática
                const currentAngle = label.angle + (elapsedTime * label.speed);
                
                // Segue a proporção do formato do coração para orbitar de forma idêntica
                const x = 16 * Math.pow(Math.sin(currentAngle), 3) * (label.distance / 15);
                const y = (13 * Math.cos(currentAngle) - 5 * Math.cos(2*currentAngle) - 2 * Math.cos(3*currentAngle) - Math.cos(4*currentAngle)) * (label.distance / 15);
                
                tempV.set(x, y, label.zOffset);
                
                // Aplica a rotação global do sistema de partículas nas palavras também
                tempV.applyAxisAngle(new THREE.Vector3(0, 0, 1), particleSystem.rotation.z);
                tempV.applyAxisAngle(new THREE.Vector3(1, 0, 0), particleSystem.rotation.x);
                tempV.applyAxisAngle(new THREE.Vector3(0, 1, 0), particleSystem.rotation.y);

                // Projeta na câmera
                tempV.project(camera);

                // Verifica se está atrás da câmera
                if (tempV.z > 1) {
                    label.element.style.opacity = 0;
                    return;
                }

                // Converte para coordenadas CSS
                const targetX = (tempV.x * widthHalf) + widthHalf;
                const targetY = -(tempV.y * heightHalf) + heightHalf;

                label.element.style.left = `${targetX}px`;
                label.element.style.top = `${targetY}px`;
                
                // Efeito de profundidade (diminui tamanho se estiver longe)
                const scale = (1 - tempV.z) * 0.8;
                label.element.style.transform = `translate(-50%, -50%) scale(${Math.max(0.5, scale)})`;
                label.element.style.opacity = cardContainer.classList.contains('hidden-card') ? 0.9 : 0.4;
            });
        }

        // --- LOOP DE ANIMAÇÃO GRÁFICA ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const positionsAttribute = geometry.attributes.position;

            // Animação das partículas orbitando em espiral para dentro do Buraco Negro
            for (let i = 0; i < particleCount; i++) {
                phases[i] += 0.004 * speeds[i];
                
                const t = phases[i];
                const factor = radii[i] * (1.0 + 0.08 * Math.sin(elapsedTime * 2.5 + i)); // Leve pulsação interna

                const x = 16 * Math.pow(Math.sin(t), 3) * factor;
                const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * factor;

                positionsAttribute.setX(i, x);
                positionsAttribute.setY(i, y);
            }
            positionsAttribute.needsUpdate = true;

            // Rotações nos eixos para dar profundidade de galáxia tridimensional
            particleSystem.rotation.z = elapsedTime * 0.06;
            particleSystem.rotation.x = Math.sin(elapsedTime * 0.15) * 0.15;
            particleSystem.rotation.y = Math.cos(elapsedTime * 0.15) * 0.15;

            // Atualiza as palavras em volta
            updateLabels(elapsedTime);

            renderer.render(scene, camera);
        }

        animate();

        // Tratamento de Responsividade de Tela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
