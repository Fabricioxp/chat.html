<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galáxia Favorita</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030008;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        #labels-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Estrutura dos fragmentos (Mini Coração + Elogio) */
        .admiration-node {
            position: absolute;
            display: flex;
            flex-direction: row; /* Alinha coração ao lado do texto para melhor leitura */
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            will-change: transform, opacity;
            opacity: 0;
            gap: 4px;
            transition: opacity 0.8s ease;
        }

        .mini-heart {
            font-size: 0.9rem;
            color: #ff2a74;
            filter: drop-shadow(0 0 4px #ff2a74);
        }

        .admiration-text {
            color: #ffffff;
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0 0 6px #ff2a74, 0 0 15px rgba(255, 42, 116, 0.5), 0 0 10px #000;
        }

        /* --- CARD DE ENTRADA --- */
        :root {
            --letter-love: 420px;
            --letter: rgba(10, 2, 6, 0.94);
        }

        .Para_Ti {
            position: absolute;
            width: 90%;
            max-width: 360px;
            height: var(--letter-love);
            background: var(--letter);
            border-radius: 20px;
            border: 2px solid #ff2a74;
            box-shadow: 0 0 30px rgba(255, 42, 116, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 25px;
            color: #fff;
            text-align: center;
            z-index: 10;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .Para_Ti h1 {
            font-size: 2.3rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .box-sticker {
            width: 110px;
            height: 110px;
        }

        .sticker-svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .poem-box {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ffe2ee;
        }

        .btn-action {
            background: #ff2a74;
            border: none;
            color: white;
            padding: 12px 45px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff2a74;
            transition: 0.3s ease;
        }

        .btn-action:hover {
            background: #ff7eb3;
            box-shadow: 0 0 25px #ff7eb3;
        }

        .card-hidden {
            opacity: 0.0;
            transform: translate(-50%, -50%) scale(0.85);
            pointer-events: none;
        }

        #drag-helper {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s;
            text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="galaxy-canvas"></canvas>
    <div id="labels-container"></div>
    <div id="drag-helper">Gire a galáxia com o dedo para revelar tudo ✨</div>

    <div class="Para_Ti" id="main-card">
        <div class="screen" style="display: flex; flex-direction: column; justify-content: space-between; height: 100%; width: 100%;">
            <h1>Galaxy Love</h1>
            <div class="box-sticker">
                <svg viewBox="0 0 100 100" class="sticker-svg">
                    <path d="M35,45 C30,30 45,30 45,45 C45,30 60,30 55,45 C52,60 35,70 35,70 C35,70 18,60 15,45 C12,30 27,30 27,45" fill="#fff"/>
                    <path d="M65,50 C61,37 73,37 73,50 C73,37 85,37 81,50 C78,62 65,70 65,70 C65,70 52,62 49,50 C46,37 58,37 58,50" fill="#ff7eb3"/>
                </svg>
            </div>
            <p class="poem-box">Nossas galáxias colidiram. Eu admiro sua força, sua beleza e a maneira como você ilumina meu mundo. Obrigado por ser você.</p>
            <button class="btn-action" onclick="startInteraction()">INICIAR</button>
        </div>
    </div>

    <script>
        let interactionActivated = false;
        const mainCard = document.getElementById('main-card');
        const dragHelper = document.getElementById('drag-helper');

        function startInteraction() {
            mainCard.classList.add('card-hidden');
            dragHelper.style.opacity = "1";
            interactionActivated = true;
        }

        // --- AMBIENTE THREE.JS ---
        const canvas = document.getElementById('galaxy-canvas');
        const labelsContainer = document.getElementById('labels-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 40;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const mainUniverseGroup = new THREE.Group();
        scene.add(mainUniverseGroup);

        // --- CORAÇÃO CENTRAL (MENOR E REFINADO) ---
        const totalDustParticles = 3000;
        const dustGeometry = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(totalDustParticles * 3);
        const dustColors = new Float32Array(totalDustParticles * 3);

        const corePhases = [];
        const coreScales = [];
        const pinkShades = [new THREE.Color('#ff0055'), new THREE.Color('#ff2a74'), new THREE.Color('#ff7eb3'), new THREE.Color('#ffffff')];

        // Reduzi o fator multiplicador para encolher o coração central (deixando-o mais delicado)
        const heartSizeFactor = 0.65; 

        for(let i=0; i < totalDustParticles; i++) {
            const angle = Math.random() * Math.PI * 2;
            corePhases.push(angle);
            
            const spreadFactor = (0.2 + Math.random() * 1.0) * heartSizeFactor;
            coreScales.push(spreadFactor);

            const t = angle;
            const x = 16 * Math.pow(Math.sin(t), 3) * spreadFactor;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * spreadFactor;
            const z = (Math.random() - 0.5) * 4;

            dustPositions[i*3] = x;
            dustPositions[i*3+1] = y;
            dustPositions[i*3+2] = z;

            const col = pinkShades[Math.floor(Math.random() * pinkShades.length)];
            dustColors[i*3] = col.r;
            dustColors[i*3+1] = col.g;
            dustColors[i*3+2] = col.b;
        }

        dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        dustGeometry.setAttribute('color', new THREE.BufferAttribute(dustColors, 3));

        const dustMaterial = new THREE.PointsMaterial({
            size: 0.3,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const coreHeartPoints = new THREE.Points(dustGeometry, dustMaterial);
        mainUniverseGroup.add(coreHeartPoints);

        // --- LABELS: EXATAMENTE 50 ADMIRAÇÕES EM ÓRBITA ---
        const admiracoes = [
            "Linda", "Inteligente", "Doce", "Corajosa", "Determinada", "Criativa", "Empática", "Forte", "Radiante", "Apaixonante",
            "Encantadora", "Inspiradora", "Única", "Perfeita", "Maravilhosa", "Cheirosa", "Carinhosa", "Amiga", "Parceira", "Leal",
            "Engraçada", "Autêntica", "Iluminada", "Preciosa", "Meiga", "Fascinante", "Esplêndida", "Incrível", "Adorável", "Brilhante",
            "Guerreira", "Generosa", "Elegante", "Magnífica", "Sábia", "Sonhadora", "Poesia viva", "Meu abrigo", "Meu norte", "Fiel",
            "Gentil", "Ouro puro", "Abençoada", "Insubstituível", "Madura", "Graciosa", "Fascinante", "Sensível", "Rara", "Minha paz"
        ];

        const nodesData = [];

        admiracoes.forEach((txt, idx) => {
            const nodeContainer = document.createElement('div');
            nodeContainer.className = 'admiration-node';

            const heartEl = document.createElement('div');
            heartEl.className = 'mini-heart';
            heartEl.innerText = '♥';

            const textEl = document.createElement('div');
            textEl.className = 'admiration-text';
            textEl.innerText = txt;

            nodeContainer.appendChild(heartEl);
            nodeContainer.appendChild(textEl);
            labelsContainer.appendChild(nodeContainer);

            const dummy3D = new THREE.Object3D();
            
            // Posicionamento esférico/orbital distribuído para cobrir todo o espaço 3D em camadas
            const phi = Math.acos(-1 + (2 * idx) / admiracoes.length);
            const theta = Math.sqrt(admiracoes.length * Math.PI) * phi;
            const orbitRadius = 11 + Math.random() * 9; // Distância perfeita ao redor do coração menor

            dummy3D.position.setFromSphericalCoords(orbitRadius, phi, theta);
            mainUniverseGroup.add(dummy3D);

            nodesData.push({
                domElement: nodeContainer,
                threeObject: dummy3D,
                phi: phi,
                theta: theta,
                radius: orbitRadius,
                speed: 0.15 + (idx % 4) * 0.05
            });
        });

        // --- SISTEMA DE TOQUE E ROTAÇÃO ---
        let dragging = false;
        let prevPosition = { x: 0, y: 0 };

        const onPointerStart = (x, y) => {
            dragging = true;
            prevPosition = { x, y };
        };

        const onPointerMove = (x, y) => {
            if (!dragging) return;
            const dx = x - prevPosition.x;
            const dy = y - prevPosition.y;

            mainUniverseGroup.rotation.y += dx * 0.007;
            mainUniverseGroup.rotation.x += dy * 0.007;

            prevPosition = { x, y };
        };

        const onPointerEnd = () => { dragging = false; };

        window.addEventListener('mousedown', (e) => onPointerStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', onPointerEnd);

        window.addEventListener('touchstart', (e) => { if(e.touches.length===1) onPointerStart(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchmove', (e) => { if(e.touches.length===1) onPointerMove(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', onPointerEnd);

        // --- LOOP DE RENDERIZAÇÃO REALTIME ---
        const clock = new THREE.Clock();
        const projectionVector = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getElapsedTime();

            // Pulsação sutil do coração de poeira cósmica
            const posAttr = coreHeartPoints.geometry.attributes.position;
            for(let i=0; i<totalDustParticles; i++) {
                corePhases[i] += 0.001;
                const t = corePhases[i];
                const factor = coreScales[i] * (1.0 + 0.04 * Math.sin(delta * 2.0 + i));
                
                const x = 16 * Math.pow(Math.sin(t), 3) * factor;
                const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * factor;
                
                posAttr.setX(i, x);
                posAttr.setY(i, y);
            }
            posAttr.needsUpdate = true;

            // Rotação autônoma quando o usuário não estiver interagindo
            if (!dragging) {
                mainUniverseGroup.rotation.y += 0.0015;
                mainUniverseGroup.rotation.x += 0.0005;
            }

            // Projeta e atualiza os 50 elementos de texto na tela
            const wHalf = window.innerWidth / 2;
            const hHalf = window.innerHeight / 2;

            nodesData.forEach((node, idx) => {
                // Pequena órbita própria contínua
                node.theta += 0.002 * node.speed;
                node.threeObject.position.setFromSphericalCoords(node.radius, node.phi, node.theta);

                node.threeObject.getWorldPosition(projectionVector);
                projectionVector.project(camera);

                if (projectionVector.z > 1) {
                    node.domElement.style.opacity = 0;
                    return;
                }

                const pxX = (projectionVector.x * wHalf) + wHalf;
                const pxY = -(projectionVector.y * hHalf) + hHalf;

                node.domElement.style.left = `${pxX}px`;
                node.domElement.style.top = `${pxY}px`;

                // Efeito de tamanho por profundidade (Z)
                const perspectiveScale = (1 - projectionVector.z) * 0.9;
                node.domElement.style.transform = `translate(-50%, -50%) scale(${Math.max(0.4, perspectiveScale)})`;

                if (interactionActivated) {
                    // Oclusão simples: esconde textos que vão para muito atrás do plano central
                    node.domElement.style.opacity = projectionVector.z > 0.65 ? "0.15" : "0.95";
                } else {
                    node.domElement.style.opacity = "0";
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
