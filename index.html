<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buraco Negro - Galaxy Love</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020005;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Container que segura os textos orbitando em HTML/CSS para manter a nitidez do vídeo */
        #orbit-labels-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .orbit-text {
            position: absolute;
            color: #ffffff;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 3px;
            white-space: nowrap;
            text-shadow: 0 0 10px #ff2a74, 0 0 20px #ff2a74, 0 0 30px #000;
            transform: translate(-50%, -50%);
            will-change: transform, opacity;
            opacity: 0.85;
        }

        /* CSS Exato e Idêntico ao do Vídeo */
        :root {
            --letter-love: 420px;
            --letter: rgba(14, 2, 7, 0.88);
        }

        .Para_Ti {
            position: absolute;
            width: 90%;
            max-width: 390px;
            height: var(--letter-love);
            background: var(--letter);
            border-radius: 20px;
            border: 2px solid #ff2a74;
            box-shadow: 0 0 30px rgba(255, 42, 116, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 25px;
            color: #fff;
            text-align: center;
            z-index: 10;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s ease;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        .Para_Ti h1 {
            font-size: 2.6rem;
            font-weight: bold;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .sticker-box {
            width: 130px;
            height: 130px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sticker {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 5px;
            color: #ff5e97;
            text-transform: uppercase;
            font-weight: bold;
        }

        .poem {
            font-size: 1rem;
            line-height: 1.6;
            color: #ffe1ed;
            margin: 15px 0;
        }

        .btn-iniciar {
            background: #ff2a74;
            border: none;
            color: white;
            padding: 12px 40px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff2a74;
            transition: 0.3s;
        }

        .btn-iniciar:hover {
            background: #ff7eb3;
            box-shadow: 0 0 25px #ff7eb3;
            transform: scale(1.05);
        }

        .btn-heart {
            background: none;
            border: none;
            font-size: 2.5rem;
            cursor: pointer;
            color: #ff2a74;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #ff2a74); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 15px #ff2a74); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px #ff2a74); }
        }

        .fade-out {
            opacity: 0.0;
            transform: translate(-50%, -50%) scale(0.85);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="singularity-canvas"></canvas>
    <div id="orbit-labels-container"></div>

    <div class="Para_Ti" id="main-card">
        <div class="screen active" id="s1">
            <h1>Galaxy Love</h1>
            <div class="sticker-box">
                <svg viewBox="0 0 100 100" class="sticker">
                    <path d="M35,45 C30,30 45,30 45,45 C45,30 60,30 55,45 C52,60 35,70 35,70 C35,70 18,60 15,45 C12,30 27,30 27,45" fill="#fff"/>
                    <path d="M65,50 C61,37 73,37 73,50 C73,37 85,37 81,50 C78,62 65,70 65,70 C65,70 52,62 49,50 C46,37 58,37 58,50" fill="#ff7eb3"/>
                </svg>
            </div>
            <p class="subtitle">LOVE</p>
            <button class="btn-iniciar" onclick="changeScreen(1)">INICIAR</button>
        </div>

        <div class="screen" id="s2">
            <h1>Amor de Minha Vida</h1>
            <div class="sticker-box">
                <svg viewBox="0 0 100 100" class="sticker">
                    <circle cx="35" cy="50" r="20" fill="#e60000"/>
                    <path d="M25,45 L35,53 L45,45 M25,55 L35,47 L45,55" stroke="#fff" stroke-width="2"/>
                    <circle cx="65" cy="50" r="20" fill="#fff" stroke="#ffb3d1"/>
                    <ellipse cx="65" cy="52" rx="3" ry="2" fill="#ff9900"/>
                    <path d="M70,36 L78,40 L74,45" fill="#ff0066"/>
                </svg>
            </div>
            <p class="poem">"Quanto mais tempo estamos juntos, mais te amo. Minha realidade paralela favorita é você."</p>
            <button class="btn-heart" onclick="changeScreen(2)">❤️</button>
        </div>

        <div class="screen" id="s3">
            <h1>Você Me Encanta</h1>
            <div class="sticker-box">
                <svg viewBox="0 0 100 100" class="sticker">
                    <path d="M15,50 C15,25 85,25 85,50 C85,75 15,75 15,50 Z" fill="#ff7eb3"/>
                    <circle cx="38" cy="48" r="4" fill="#000"/><circle cx="62" cy="48" r="4" fill="#000"/>
                    <path d="M45,60 Q50,65 55,60" stroke="#000" stroke-width="3" fill="none"/>
                </svg>
            </div>
            <p class="poem">"Se eu pudesse escolher um lugar seguro para passar a eternidade... seria ao seu lado."</p>
            <button class="btn-heart" onclick="changeScreen(0)">❤️</button>
        </div>
    </div>

    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_boost;

        // Função matemática para criar a distorção do formato do coração
        float heartShape(vec2 p) {
            p.x *= 1.2;
            p.y -= 0.25;
            float a = atan(p.x, p.y) / 3.14159265;
            float r = length(p);
            // Fórmula do formato clássico do coração cardioide
            float h = abs(a);
            float d = (13.0*h - 5.0*cos(2.0*h*3.1415) - 2.0*cos(3.0*h*3.1415) - cos(4.0*h*3.1415))/16.0;
            return r - d * 0.55;
        }

        // Pseudo-random noise para simular a poeira e nuvens cósmicas incandescendo
        float noise(in vec2 p) {
            return frac(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        float fbm(in vec2 p) {
            float v = 0.0;
            float amp = 0.5;
            for (int i = 0; i < 4; i++) {
                v += amp * sin(p.x * 2.0 + u_time * 2.0);
                p *= 2.1;
                amp *= 0.5;
            }
            return v;
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
            
            // Distorção Espiral (Simulando a rotação de um Buraco Negro de Kerr)
            float r = length(uv);
            float theta = atan(uv.y, uv.x);
            
            // Quanto mais perto do horizonte de eventos, maior a torção gravitacional (redshift/lensing)
            float distortion = 0.8 / (r + 0.08);
            theta += elapsedTime * 1.5 + distortion;
            
            // Reconstrói as coordenadas mapeadas na distorção extrema da singularidade
            vec2 rotatedUv = vec2(cos(theta), sin(theta)) * r;

            // Define a distância até a borda do coração negro
            float distToHeart = heartShape(rotatedUv);

            // Cores base do vídeo (Preto profundo, Rosa choque neon, Vermelho escuro e Brilho esbranquiçado)
            vec3 blackHole = vec3(0.0, 0.0, 0.0);
            vec3 accretionGlow = vec3(1.0, 0.16, 0.45); // #ff2a74
            vec3 cosmicDust = vec3(0.4, 0.0, 0.15);

            vec3 finalColor = vec3(0.0);

            if (distToHeart < 0.0) {
                // Dentro do Horizonte de Eventos (Singularidade absoluta em formato de coração)
                finalColor = blackHole;
            } else {
                // Disco de Acreção e distorção de lentes ao redor do coração
                float glowIntensity = exp(-distToHeart * 6.5); // Queda exponencial de luz
                float ringPattern = sin(1.0 / distToHeart * 8.0 - u_time * 12.0);
                
                // Adiciona turbulência de plasma cósmico
                float plasma = fbm(rotatedUv * 4.0 + ringPattern * 0.2);
                
                finalColor = accretionGlow * (glowIntensity * 1.8) * (1.0 + plasma * 0.4);
                finalColor += cosmicDust * exp(-distToHeart * 1.5);
                
                // Estrelas ao fundo que sofrem refração gravitacional nas bordas
                float stars = step(0.996, sin(uv.x * 150.0) * cos(uv.y * 150.0 + u_time * 0.05));
                finalColor += vec3(stars) * step(0.6, distToHeart) * 0.4;
            }

            // Correção de gamma e brilho
            gl_FragColor = vec4(pow(finalColor, vec3(0.85)), 1.0);
        }
    </script>

    <script>
        // --- GERENCIADOR DE TELAS INTERATIVAS ---
        const card = document.getElementById('main-card');
        const screens = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];
        let boostShader = 0.0;

        function changeScreen(index) {
            card.classList.add('fade-out');
            boostShader = 1.0; // Intensifica temporariamente o brilho do buraco negro quando clica

            setTimeout(() => {
                screens.forEach(s => s.classList.remove('active'));
                screens[index].classList.add('active');
                boostShader = 0.0;
            }, 800);

            // Deixa o buraco negro exposto flutuando por um tempo igual ao vídeo
            setTimeout(() => {
                card.classList.remove('fade-out');
            }, 3500);
        }

        // --- SISTEMA GRÁFICO SHADER 3D + LABELS ORBITAIS ---
        const canvas = document.getElementById('singularity-canvas');
        const labelsContainer = document.getElementById('orbit-labels-container');

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Uniforms para conversar com a GPU via fragment shader
        const uniforms = {
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_time: { value: 0 },
            u_boost: { value: 0 }
        };

        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial({
            vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            uniforms: uniforms
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // --- PALAVRAS EM PORTUGUÊS TRAVADAS NA ÓRBITA DO CORAÇÃO ---
        const textos = [
            "INFINITO ∞", "TE AMO ❤️", "AMOR ETERNO", "AMOR DA MINHA VIDA",
            "INFINITO ∞", "TE AMO ❤️", "AMOR ETERNO", "MEU TUDO ✨"
        ];
        
        const labelsData = [];
        textos.forEach((txt, i) => {
            const div = document.createElement('div');
            div.className = 'orbit-text';
            div.innerText = txt;
            labelsContainer.appendChild(div);

            labelsData.push({
                element: div,
                angle: (i / textos.length) * Math.PI * 2,
                baseRadius: 0.38 + (i % 2) * 0.12, // Diferentes distâncias para criar camadas como no vídeo
                speed: 0.5 + (i % 3) * 0.2
            });
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            // Atualiza dados na GPU
            uniforms.u_time.value = time;
            uniforms.u_boost.value = THREE.MathUtils.lerp(uniforms.u_boost.value, boostShader, 0.05);

            // Animação e posicionamento das palavras ao redor do formato do coração do buraco negro
            const w = window.innerWidth;
            const h = window.innerHeight;
            const minDim = Math.min(w, h);

            labelsData.forEach(label => {
                // Calcula a órbita arrastada pela força gravitacional do shader
                const currentAngle = label.angle - (time * label.speed);
                
                // Equação paramétrica do coração aplicada no mapeamento do texto
                const t = currentAngle;
                const factor = label.baseRadius;
                
                // Ajusta as coordenadas para o espaço cartesiano da tela
                let x = 16.0 * Math.pow(Math.sin(t), 3.0) * (factor / 16.0);
                let y = (13.0 * Math.cos(t) - 5.0 * Math.cos(2.0*t) - 2.0 * Math.cos(3.0*t) - Math.cos(4.0*t)) * (factor / 16.0);
                
                // Pequeno ajuste vertical para alinhar com o centro real do shader do coração
                y += 0.06;

                // Converte de -1 / 1 para coordenadas de pixels de forma responsiva
                const screenX = (x * minDim / 2) + (w / 2);
                const screenY = -(y * minDim / 2) + (h / 2);

                // Aplica a transformação física nas palavras com rotação tangencial
                label.element.style.transform = `translate(-50%, -50%) translate(${screenX}px, ${screenY}px) rotate(${-t + Math.PI/2}rad)`;
                
                // Se o card principal estiver visível, reduz a opacidade dos textos de fundo para dar foco
                if (card.classList.contains('fade-out')) {
                    label.element.style.opacity = "0.9";
                } else {
                    label.element.style.opacity = "0.25";
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
