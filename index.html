<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Love - O que eu admiro em você</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020005;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* Container HTML para renderizar os textos e mini corações na exata posição 3D */
        #labels-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Estrutura de cada bloco de admiração (Coração + Texto) */
        .admiration-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            will-change: transform, opacity;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* O mini coração rosa brilhante acima do texto */
        .mini-heart {
            font-size: 1.4rem;
            color: #ff4081;
            filter: drop-shadow(0 0 6px #ff2a74) drop-shadow(0 0 12px #ff2a74);
            animation: floatHeart 2s infinite ease-in-out;
            margin-bottom: 2px;
        }

        /* O elogio estilizado idêntico à imagem */
        .admiration-text {
            color: #ffffff;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0 0 8px #ff2a74, 0 0 15px rgba(255, 42, 116, 0.6), 0 0 25px #000;
        }

        /* Animação individual de flutuação dos coraçõezinhos */
        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.1); }
        }

        /* --- INTERFACE DE INTRODUÇÃO (.Para_Ti) --- */
        :root {
            --letter-love: 420px;
            --letter: rgba(12, 1, 6, 0.92);
        }

        .Para_Ti {
            position: absolute;
            width: 90%;
            max-width: 380px;
            height: var(--letter-love);
            background: var(--letter);
            border-radius: 24px;
            border: 2px solid #ff2a74;
            box-shadow: 0 0 35px rgba(255, 42, 116, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 25px;
            color: #fff;
            text-align: center;
            z-index: 10;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        .Para_Ti h1 {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .box-sticker {
            width: 120px;
            height: 120px;
            margin: 15px 0;
        }

        .sticker-svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .poem-box {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ffe2ee;
            margin: 15px 0;
        }

        .btn-action {
            background: #ff2a74;
            border: none;
            color: white;
            padding: 12px 45px;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff2a74;
            transition: 0.3s ease;
        }

        .btn-action:hover {
            background: #ff7eb3;
            box-shadow: 0 0 25px #ff7eb3;
        }

        .card-hidden {
            opacity: 0.0;
            transform: translate(-50%, -50%) scale(0.85);
            pointer-events: none;
        }

        #drag-helper {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s;
            text-align: center;
            text-shadow: 0 0 8px #000;
        }
    </style>
</head>
<body>

    <canvas id="galaxy-canvas"></canvas>
    <div id="labels-container"></div>
    <div id="drag-helper">Arraste com o dedo para girar o coração 💖</div>

    <div class="Para_Ti" id="main-card">
        <div class="screen active" id="scr-intro">
            <h1>Galaxy Love</h1>
            <div class="box-sticker">
                <svg viewBox="0 0 100 100" class="sticker-svg">
                    <path d="M35,45 C30,30 45,30 45,45 C45,30 60,30 55,45 C52,60 35,70 35,70 C35,70 18,60 15,45 C12,30 27,30 27,45" fill="#fff"/>
                    <path d="M65,50 C61,37 73,37 73,50 C73,37 85,37 81,50 C78,62 65,70 65,70 C65,70 52,62 49,50 C46,37 58,37 58,50" fill="#ff7eb3"/>
                </svg>
            </div>
            <p class="poem-box">Nossas galáxias colidiram. Eu admiro sua força, sua beleza e a maneira como você ilumina meu mundo.</p>
            <button class="btn-action" onclick="startInteraction()">VER ADMIRAÇÕES</button>
        </div>
    </div>

    <script>
        // --- CONTROLE DE INTERFACE ---
        const mainCard = document.getElementById('main-card');
        const dragHelper = document.getElementById('drag-helper');
        let interactionActivated = false;

        function startInteraction() {
            mainCard.classList.add('card-hidden');
            dragHelper.style.opacity = "1";
            interactionActivated = true;
        }

        // --- MOTOR GRÁFICO 3D (THREE.JS) ---
        const canvas = document.getElementById('galaxy-canvas');
        const labelsContainer = document.getElementById('labels-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 40;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Grupo principal que armazena a estrutura central e os nós orbitais para girarem juntos
        const mainUniverseGroup = new THREE.Group();
        scene.add(mainUniverseGroup);

        // --- GERANDO O GRANDE CORAÇÃO DE POEIRA CÓSMICA BRILHANTE ---
        const totalDustParticles = 4000;
        const dustGeometry = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(totalDustParticles * 3);
        const dustColors = new Float32Array(totalDustParticles * 3);

        const corePhases = [];
        const coreScales = [];

        const pinkShades = [
            new THREE.Color('#ff0055'),
            new THREE.Color('#ff2a74'),
            new THREE.Color('#ff7eb3'),
            new THREE.Color('#ffffff')
        ];

        for(let i=0; i < totalDustParticles; i++) {
            const angle = Math.random() * Math.PI * 2;
            corePhases.push(angle);
            
            const spreadFactor = 0.3 + Math.random() * 1.1;
            coreScales.push(spreadFactor);

            const t = angle;
            const x = 16 * Math.pow(Math.sin(t), 3) * spreadFactor;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * spreadFactor;
            const z = (Math.random() - 0.5) * 5;

            dustPositions[i*3] = x;
            dustPositions[i*3+1] = y;
            dustPositions[i*3+2] = z;

            const col = pinkShades[Math.floor(Math.random() * pinkShades.length)];
            dustColors[i*3] = col.r;
            dustColors[i*3+1] = col.g;
            dustColors[i*3+2] = col.b;
        }

        dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        dustGeometry.setAttribute('color', new THREE.BufferAttribute(dustColors, 3));

        const dustMaterial = new THREE.PointsMaterial({
            size: 0.35,
            vertexColors: true,
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending
        });

        const coreHeartPoints = new THREE.Points(dustGeometry, dustMaterial);
        mainUniverseGroup.add(coreHeartPoints);


        // --- LISTA DE ADMIRAÇÕES (MINI CORAÇÃO + TEXTO DO INSTAGRAM/TIKTOK) ---
        const admiraçoes = [
            "Linda", "Inteligente", "Doce", "Corajosa", "Determinada", 
            "Criativa", "Empática", "Forte", "Radiante", "Apaixonante", 
            "Encantadora", "Inspiradora", "Única", "Perfeita"
        ];

        const nodesData = [];

        admiraçoes.forEach((txt, idx) => {
            // Criação da estrutura de nós no HTML
            const nodeContainer = document.createElement('div');
            nodeContainer.className = 'admiration-node';

            const heartEl = document.createElement('div');
            heartEl.className = 'mini-heart';
            heartEl.innerText = '♥';

            const textEl = document.createElement('div');
            textEl.className = 'admiration-text';
            textEl.innerText = txt;

            nodeContainer.appendChild(heartEl);
            nodeContainer.appendChild(textEl);
            labelsContainer.appendChild(nodeContainer);

            // Criação do ponto de referência 3D acoplado ao Universo
            const dummy3D = new THREE.Object3D();
            
            // Posicionamento esférico/orbital ao redor do coração central
            const theta = (idx / admiraçoes.length) * Math.PI * 2;
            const orbitRadius = 15 + Math.random() * 6; // Raio externo ao coração principal

            dummy3D.position.x = Math.cos(theta) * orbitRadius;
            dummy3D.position.y = Math.sin(theta) * orbitRadius;
            dummy3D.position.z = (Math.random() - 0.5) * 8;

            mainUniverseGroup.add(dummy3D);

            nodesData.push({
                domElement: nodeContainer,
                threeObject: dummy3D,
                angle: theta,
                radius: orbitRadius,
                speed: 0.2 + (idx % 3) * 0.1
            });
        });


        // --- SISTEMA INTERATIVO DE ARRASTAR COM O DEDO / MOUSE ---
        let dragging = false;
        let prevPosition = { x: 0, y: 0 };

        const onPointerStart = (x, y) => {
            dragging = true;
            prevPosition = { x, y };
        };

        const onPointerMove = (x, y) => {
            if (!dragging) return;
            const dx = x - prevPosition.x;
            const dy = y - prevPosition.y;

            // Transfere o movimento do arrasto diretamente para os eixos de rotação 3D
            mainUniverseGroup.rotation.y += dx * 0.007;
            mainUniverseGroup.rotation.x += dy * 0.007;

            prevPosition = { x, y };
        };

        const onPointerEnd = () => { dragging = false; };

        // Desktop
        window.addEventListener('mousedown', (e) => onPointerStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', onPointerEnd);

        // Mobile (Toque)
        window.addEventListener('touchstart', (e) => { if(e.touches.length===1) onPointerStart(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchmove', (e) => { if(e.touches.length===1) onPointerMove(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', onPointerEnd);


        // --- LOOP DE ANIMAÇÃO REALTIME ---
        const clock = new THREE.Clock();
        const projectionVector = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getElapsedTime();

            // Pulsação sutil e contínua do coração central de poeira cósmica
            const posAttr = coreHeartPoints.geometry.attributes.position;
            for(let i=0; i<totalDustParticles; i++) {
                corePhases[i] += 0.002;
                const t = corePhases[i];
                const factor = coreScales[i] * (1.0 + 0.05 * Math.sin(delta * 2.5 + i));
                
                const x = 16 * Math.pow(Math.sin(t), 3) * factor;
                const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * factor;
                
                posAttr.setX(i, x);
                posAttr.setY(i, y);
            }
            posAttr.needsUpdate = true;

            // Mantém uma rotação inercial lenta se o usuário soltar o dedo
            if (!dragging) {
                mainUniverseGroup.rotation.y += 0.002;
            }

            // PROJEÇÃO DAS ADMIRAÇÕES E MINI CORAÇÕES EM COORDENADAS DA TELA
            const wHalf = window.innerWidth / 2;
            const hHalf = window.innerHeight / 2;

            nodesData.forEach(node => {
                // Movimento orbital contínuo ao redor do contorno do coração
                node.threeObject.position.x = Math.cos(node.angle + (delta * node.speed)) * node.radius;
                node.threeObject.position.y = Math.sin(node.angle + (delta * node.speed)) * node.radius;

                // Coleta a posição global calculada após o arrasto do dedo
                node.threeObject.getWorldPosition(projectionVector);
                projectionVector.project(camera);

                if (projectionVector.z > 1) {
                    node.domElement.style.opacity = 0;
                    return;
                }

                const pxX = (projectionVector.x * wHalf) + wHalf;
                const pxY = -(projectionVector.y * hHalf) + hHalf;

                node.domElement.style.left = `${pxX}px`;
                node.domElement.style.top = `${pxY}px`;

                // Escalonamento de tamanho baseado na distância da profundidade 3D (Z)
                const perspectiveScale = (1 - projectionVector.z) * 0.9;
                node.domElement.style.transform = `translate(-50%, -50%) scale(${Math.max(0.35, perspectiveScale)})`;

                // Só exibe os textos quando o usuário clica em iniciar
                if (interactionActivated) {
                    node.domElement.style.opacity = "0.9";
                } else {
                    node.domElement.style.opacity = "0";
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
