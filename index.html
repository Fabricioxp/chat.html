<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minha Galáxia Favorita</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-color: #010004;
            --primary-glow: #ff2a74;
            --secondary-glow: #ff7eb3;
            --text-color: #ffffff;
            --card-bg: rgba(8, 1, 4, 0.85);
            --transition-slow: 1s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-fast: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            position: relative;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }

        #webgl-canvas:active {
            cursor: grabbing;
        }

        #overlay-labels {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .admiration-label {
            position: absolute;
            color: var(--text-color);
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
            pointer-events: auto;
            text-shadow: 
                0 0 6px var(--primary-glow), 
                0 0 15px var(--primary-glow), 
                0 0 25px #000000;
            will-change: transform, left, top, opacity;
            transition: color 0.3s;
        }

        .admiration-label:hover {
            color: var(--secondary-glow);
            text-shadow: 0 0 10px #fff, 0 0 20px var(--primary-glow);
        }

        /* Estilos dos Corações com Letras da Maria */
        .maria-heart-container {
            position: absolute;
            width: 50px;
            height: 50px;
            pointer-events: none;
            will-change: transform, opacity;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
        }

        .maria-heart-shape {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ff0055;
            transform: rotate(-45deg);
            box-shadow: 0 0 15px #ff2a74, 0 0 30px #ff0055;
            animation: pulse-heart 1.2s infinite alternate ease-in-out;
        }

        .maria-heart-shape::before,
        .maria-heart-shape::after {
            content: "";
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ff0055;
            border-radius: 50%;
        }

        .maria-heart-shape::before { top: -20px; left: 0; }
        .maria-heart-shape::after { left: 20px; top: 0; }

        .maria-letter {
            position: relative;
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 900;
            z-index: 4;
            text-shadow: 0 0 8px #000;
            font-family: 'Georgia', serif;
        }

        @keyframes pulse-heart {
            0% { transform: rotate(-45deg) scale(0.9); }
            100% { transform: rotate(-45deg) scale(1.1); }
        }

        /* Containeres de Interface (Intro e Modal) */
        #intro-container, #modal-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-color) 100%);
            transition: opacity var(--transition-slow), visibility var(--transition-slow);
        }

        #modal-container {
            z-index: 20;
            background: rgba(1, 0, 4, 0.75);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #modal-container.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .glass-card {
            width: 90%;
            max-width: 420px;
            padding: 40px 30px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid rgba(255, 42, 116, 0.3);
            box-shadow: 0 0 40px rgba(255, 42, 116, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transform: scale(1);
            transition: transform var(--transition-slow), opacity var(--transition-slow);
        }

        .glass-card.hide {
            transform: scale(0.85);
            opacity: 0;
            pointer-events: none;
        }

        .title-glow {
            font-size: 1.8rem;
            line-height: 1.3;
            font-weight: 900;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ffffff 0%, var(--secondary-glow) 50%, var(--primary-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .btn-enter {
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--primary-glow);
            padding: 15px 40px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 3px;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all var(--transition-fast);
            box-shadow: 0 0 15px rgba(255, 42, 116, 0.2);
        }

        .btn-enter:hover {
            box-shadow: 0 0 30px var(--primary-glow);
            transform: translateY(-2px);
            background: rgba(255, 42, 116, 0.15);
        }

        #interaction-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>
    <div id="overlay-labels"></div>
    <div id="interaction-hint">Toque, arraste e clique nas palavras</div>

    <div id="intro-container">
        <div class="glass-card" id="main-card">
            <h1 class="title-glow">Motivos e detalhes que me fez e me faz ser apaixonado por você</h1>
            <button class="btn-enter" onclick="App.start()">EXPLORAR</button>
        </div>
    </div>

    <div id="modal-container">
        <div class="glass-card">
            <h1 class="title-glow" id="modal-title" style="font-size: 2.2rem; margin-bottom: 15px;">Palavra</h1>
            <p class="modal-text" id="modal-desc">Texto detalhado explicando o motivo...</p>
            <button class="btn-enter" onclick="App.closeModal()">VOLTAR</button>
        </div>
    </div>

    <script>

                { word: "Intensa", desc: "Amo a forma como você sente, como você vive e como você se entrega a tudo que ama." },
                { word: "Leal", desc: "A sua lealdade e o seu cuidado me dão a maior segurança e conforto que já senti." },
                { word: "Magnífica", desc: "Simplesmente não há adjetivos suficientes para descrever o quão grandiosa você é." },
                { word: "Amiga", desc: "Além de ser o amor da minha vida, você é a minha melhor amiga e confidente." },
                { word: "Anjo", desc: "Às vezes eu acho que você realmente é um anjo que veio para me salvar e iluminar meu caminho." },
                { word: "Criativa", desc: "A sua mente trabalha de um jeito lindo, sempre me surpreendendo com ideias incríveis." },
                { word: "Elegante", desc: "Até nos momentos mais casuais e simples, você tem uma elegância que é só sua." },
                { word: "Deslumbrante", desc: "É impossível não parar e admirar o quão deslumbrante você fica, mesmo sem tentar." },
                { word: "Maravilhosa", desc: "Você é uma verdadeira maravilha, com certeza a melhor parte de todos os meus dias." },
                { word: "Incomparável", desc: "Eu poderia rodar o universo inteiro e nunca encontraria alguém como você." }

        const MathUtils = {
            randomRange: (min, max) => Math.random() * (max - min) + min,
            getHeartCoordinate: (t, scale) => {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const z = (Math.random() - 0.5) * 6;
                return new THREE.Vector3(x * scale, y * scale, z * scale);
            },
            lerp: (start, end, amt) => (1 - amt) * start + amt * end
        };

        class GeometryFactory {
            static createMiniHeartGeometry() {
                const shape = new THREE.Shape();
                const x = 0, y = 0;
                shape.moveTo(x + 2.5, y + 2.5);
                shape.bezierCurveTo(x + 2.5, y + 2.5, x + 2.0, y, x, y);
                shape.bezierCurveTo(x - 3.0, y, x - 3.0, y + 3.5, x - 3.0, y + 3.5);
                shape.bezierCurveTo(x - 3.0, y + 5.5, x - 1.0, y + 7.7, x + 2.5, y + 9.5);
                shape.bezierCurveTo(x + 6.0, y + 7.7, x + 8.0, y + 5.5, x + 8.0, y + 3.5);
                shape.bezierCurveTo(x + 8.0, y + 3.5, x + 8.0, y, x + 5.0, y);
                shape.bezierCurveTo(x + 3.5, y, x + 2.5, y + 2.5, x + 2.5, y + 2.5);

                const geometry = new THREE.ShapeGeometry(shape);
                geometry.computeBoundingBox();
                const centerOffset = new THREE.Vector3();
                geometry.boundingBox.getCenter(centerOffset).multiplyScalar(-1);
                geometry.translate(centerOffset.x, centerOffset.y, centerOffset.z);
                geometry.scale(0.04, 0.04, 0.04);
                geometry.rotateZ(Math.PI);

                return geometry;
            }
        }

        class GalaxyCore {
            constructor(scene, parentGroup) {
                this.scene = scene;
                this.parentGroup = parentGroup;
                this.mesh = null;
                this.dummy = new THREE.Object3D();
                this.phases = new Float32Array(CONFIG.totalMiniHearts);
                this.speeds = new Float32Array(CONFIG.totalMiniHearts);
                this.scales = new Float32Array(CONFIG.totalMiniHearts);
                this.basePositions = [];
                this.rotations = [];
                
                this.init();
            }

            init() {
                const geometry = GeometryFactory.createMiniHeartGeometry();
                const material = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.85,
                    blending: THREE.AdditiveBlending
                });

                this.mesh = new THREE.InstancedMesh(geometry, material, CONFIG.totalMiniHearts);
                this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

                const colorObj = new THREE.Color();
                
                for (let i = 0; i < CONFIG.totalMiniHearts; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    this.phases[i] = angle;
                    this.speeds[i] = MathUtils.randomRange(0.2, 1.5);
                    const spread = MathUtils.randomRange(0.2, 1.3) * CONFIG.heartMacroScale;
                    this.scales[i] = spread;

                    const pos = MathUtils.getHeartCoordinate(angle, spread);
                    this.basePositions.push({ x: pos.x, y: pos.y, z: pos.z, spread: spread });

                    const rotX = Math.random() * Math.PI;
                    const rotY = Math.random() * Math.PI;
                    const rotZ = Math.random() * Math.PI;
                    this.rotations.push({ x: rotX, y: rotY, z: rotZ });

                    this.dummy.position.copy(pos);
                    this.dummy.rotation.set(rotX, rotY, rotZ);
                    this.dummy.updateMatrix();
                    this.mesh.setMatrixAt(i, this.dummy.matrix);

                    const hexColor = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
                    colorObj.set(hexColor);
                    this.mesh.setColorAt(i, colorObj);
                }

                this.parentGroup.add(this.mesh);
            }

            update(time) {
                if (!this.mesh) return;

                for (let i = 0; i < CONFIG.totalMiniHearts; i++) {
                    this.phases[i] += 0.002 * this.speeds[i];
                    const t = this.phases[i];
                    const dynamicScale = this.scales[i] * (1.0 + 0.06 * Math.sin(time * 2.5 + i));

                    const x = 16 * Math.pow(Math.sin(t), 3) * dynamicScale;
                    const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * dynamicScale;
                    const z = this.basePositions[i].z + Math.sin(time + i) * 0.5;

                    this.rotations[i].x += 0.01;
                    this.rotations[i].y += 0.015;

                    this.dummy.position.set(x, y, z);
                    this.dummy.rotation.set(this.rotations[i].x, this.rotations[i].y, this.rotations[i].z);
                    this.dummy.updateMatrix();
                    this.mesh.setMatrixAt(i, this.dummy.matrix);
                }
                this.mesh.instanceMatrix.needsUpdate = true;
            }
        }

        // Classe criada para gerenciar os 5 corações especiais do nome MARIA
        class MariaHearts {
            constructor(camera, containerElement, universeGroup) {
                this.camera = camera;
                this.container = containerElement;
                this.universeGroup = universeGroup;
                this.hearts = [];
                this.name = "MARIA";
                this.cycleDuration = 20; // 10s voando + 10s reunidos
                
                this.init();
            }

            init() {
                for (let i = 0; i < this.name.length; i++) {
                    const div = document.createElement('div');
                    div.className = 'maria-heart-container';
                    div.style.opacity = '0';
                    
                    const heartShape = document.createElement('div');
                    heartShape.className = 'maria-heart-shape';
                    
                    const letterSpan = document.createElement('div');
                    letterSpan.className = 'maria-letter';
                    letterSpan.innerText = this.name[i];

                    div.appendChild(heartShape);
                    div.appendChild(letterSpan);
                    this.container.appendChild(div);

                    const anchor3D = new THREE.Object3D();
                    this.universeGroup.add(anchor3D);

                    // Posição para quando estiverem reunidos no centro do coração gigante (Alinhados horizontalmente)
                    const targetX = (i - 2) * 3.2; 
                    const targetY = -1.0; 
                    const targetZ = 2.0;

                    this.hearts.push({
                        element: div,
                        object3D: anchor3D,
                        // Configurações para o vôo aleatório
                        randomSeed: Math.random() * 100,
                        flightRadius: MathUtils.randomRange(14, 22),
                        phi: MathUtils.randomRange(0.2, Math.PI - 0.2),
                        theta: MathUtils.randomRange(0, Math.PI * 2),
                        speed: MathUtils.randomRange(0.3, 0.6),
                        // Destinos centrais fixos
                        targetPos: new THREE.Vector3(targetX, targetY, targetZ)
                    });
                }
            }

            update(time) {
                const halfWidth = window.innerWidth / 2;
                const halfHeight = window.innerHeight / 2;
                const projVector = new THREE.Vector3();

                // Lógica do ciclo: Retorna o resto da divisão por 20 segundos
                const cycleTime = time % this.cycleDuration;
                const isGathered = cycleTime >= 10; // Primeiros 10s dispersos, próximos 10s juntos

                this.hearts.forEach((heart, index) => {
                    let currentTarget = new THREE.Vector3();

                    if (!isGathered) {
                        // Modo Voando: Atualiza órbita esférica suave entre as outras palavras
                        heart.theta += 0.002 * heart.speed;
                        heart.phi += Math.sin(time * 0.2 + heart.randomSeed) * 0.0005;
                        
                        currentTarget.setFromSphericalCoords(heart.flightRadius, heart.phi, heart.theta);
                        // Adiciona flutuação orgânica extra (ruído leve)
                        currentTarget.x += Math.sin(time + heart.randomSeed) * 2;
                        currentTarget.y += Math.cos(time * 0.8 + heart.randomSeed) * 2;
                    } else {
                        // Modo Reunido: Destino fixo no meio do coração macro
                        currentTarget.copy(heart.targetPos);
                    }

                    // Interpolação suave (Lerp) para transição macia entre os dois estados
                    heart.object3D.position.lerp(currentTarget, 0.06);

                    // Converte coordenadas 3D para tela 2D
                    heart.object3D.getWorldPosition(projVector);
                    const depthZ = projVector.z;
                    projVector.project(this.camera);

                    if (projVector.z > 1 || !App.labelManager.isActive) {
                        heart.element.style.opacity = "0";
                        return;
                    }

                    const screenX = (projVector.x * halfWidth) + halfWidth;
                    const screenY = -(projVector.y * halfHeight) + halfHeight;

                    heart.element.style.left = `${screenX}px`;
                    heart.element.style.top = `${screenY}px`;

                    // Ajusta escala por profundidade de câmera e opacidade
                    heart.element.style.opacity = "1";
                    const scaleFactor = depthZ > 0 ? (1 + (depthZ / 35)) : (1 - (Math.abs(depthZ) / 35));
                    heart.element.style.transform = `translate(-50%, -50%) scale(${Math.max(0.4, scaleFactor * 0.95)})`;
                });
            }
        }

        class LabelManager {
            constructor(camera, containerElement, universeGroup) {
                this.camera = camera;
                this.container = containerElement;
                this.universeGroup = universeGroup; 
                this.labels = [];
                this.isActive = false;
                
                this.init();
            }

            init() {
                const items = CONFIG.admirations;
                
                items.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'admiration-label';
                    div.style.opacity = '0';
                    div.innerText = item.word;
                    
                    div.onclick = () => {
                        App.openModal(item.word, item.desc);
                    };

                    this.container.appendChild(div);

                    const anchor3D = new THREE.Object3D();
                    
                    const phi = Math.acos(-1 + (2 * index) / items.length);
                    const theta = Math.sqrt(items.length * Math.PI) * phi;
                    
                    const radius = MathUtils.randomRange(18, 26);

                    anchor3D.position.setFromSphericalCoords(radius, phi, theta);
                    
                    this.universeGroup.add(anchor3D);

                    this.labels.push({
                        element: div,
                        object3D: anchor3D,
                        baseRadius: radius,
                        phi: phi,
                        theta: theta,
                        orbitSpeed: MathUtils.randomRange(0.1, 0.4) * (Math.random() > 0.5 ? 1 : -1)
                    });
                });
            }

            activate() {
                this.isActive = true;
            }

            update(time) {
                const halfWidth = window.innerWidth / 2;
                const halfHeight = window.innerHeight / 2;
                const projVector = new THREE.Vector3();

                this.labels.forEach(label => {
                    label.theta += 0.001 * label.orbitSpeed;
                    label.object3D.position.setFromSphericalCoords(label.baseRadius, label.phi, label.theta);

                    label.object3D.getWorldPosition(projVector);
                    const profundidadeZ = projVector.z;

                    projVector.project(this.camera);

                    if (projVector.z > 1 || !this.isActive) {
                        label.element.style.opacity = "0";
                        return;
                    }

                    const screenX = (projVector.x * halfWidth) + halfWidth;
                    const screenY = -(projVector.y * halfHeight) + halfHeight;

                    label.element.style.left = `${screenX}px`;
                    label.element.style.top = `${screenY}px`;

                    if (profundidadeZ > 0) {
                        label.element.style.opacity = "0.95";
                        label.element.style.zIndex = 10;
                        label.element.style.transform = `translate(-50%, -50%) scale(${1 + (profundidadeZ / 35)})`;
                    } else {
                        label.element.style.opacity = "0.15"; 
                        label.element.style.zIndex = 1;
                        label.element.style.transform = `translate(-50%, -50%) scale(${1 - (Math.abs(profundidadeZ) / 35)})`;
                    }
                });
            }
        }

        class InteractionManager {
            constructor(targetGroup) {
                this.target = targetGroup;
                this.isDragging = false;
                this.previousMousePosition = { x: 0, y: 0 };
                this.velocity = { x: 0.001, y: 0.0015 };
                this.friction = 0.95;
                this.sensitivity = 0.005;

                this.bindEvents();
            }

            bindEvents() {
                window.addEventListener('mousedown', (e) => this.onPointerDown(e.clientX, e.clientY));
                window.addEventListener('mousemove', (e) => this.onPointerMove(e.clientX, e.clientY));
                window.addEventListener('mouseup', () => this.onPointerUp());
                window.addEventListener('mouseleave', () => this.onPointerUp());

                window.addEventListener('touchstart', (e) => {
                    if(e.touches.length === 1) this.onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: false });
                
                window.addEventListener('touchmove', (e) => {
                    if(e.touches.length === 1) {
                        e.preventDefault();
                        this.onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }, { passive: false });
                
                window.addEventListener('touchend', () => this.onPointerUp());
            }

            onPointerDown(x, y) {
                this.isDragging = true;
                this.previousMousePosition = { x, y };
                this.velocity = { x: 0, y: 0 };
            }

            onPointerMove(x, y) {
                if (!this.isDragging) return;
                const deltaX = x - this.previousMousePosition.x;
                const deltaY = y - this.previousMousePosition.y;

                this.velocity.x = deltaY * this.sensitivity;
                this.velocity.y = deltaX * this.sensitivity;

                this.previousMousePosition = { x, y };
            }

            onPointerUp() {
                this.isDragging = false;
            }

            update() {
                this.target.rotation.x += this.velocity.x;
                this.target.rotation.y += this.velocity.y;

                if (!this.isDragging) {
                    this.velocity.x *= this.friction;
                    this.velocity.y *= this.friction;

                    if (Math.abs(this.velocity.x) < 0.0005) this.velocity.x = MathUtils.lerp(this.velocity.x, 0.0005, 0.05);
                    if (Math.abs(this.velocity.y) < 0.001) this.velocity.y = MathUtils.lerp(this.velocity.y, 0.0015, 0.05);
                }
            }
        }

        const App = {
            scene: null,
            camera: null,
            renderer: null,
            clock: null,
            universeGroup: null,
            galaxyCore: null,
            labelManager: null,
            mariaHearts: null, // Nova referência adicionada
            interaction: null,
            isStarted: false,

            init: function() {
                this.scene = new THREE.Scene();
                this.scene.background = null; 

                this.camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.z = 45; 

                const canvas = document.getElementById('webgl-canvas');
                this.renderer = new THREE.WebGLRenderer({ 
                    canvas: canvas, 
                    antialias: true,
                    alpha: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                this.universeGroup = new THREE.Group();
                this.scene.add(this.universeGroup);

                this.clock = new THREE.Clock();
                
                this.galaxyCore = new GalaxyCore(this.scene, this.universeGroup);
                
                const labelContainer = document.getElementById('overlay-labels');
                this.labelManager = new LabelManager(this.camera, labelContainer, this.universeGroup);
                
                // Instanciando os corações da Maria
                this.mariaHearts = new MariaHearts(this.camera, labelContainer, this.universeGroup);
                
                this.interaction = new InteractionManager(this.universeGroup);

                window.addEventListener('resize', this.onWindowResize.bind(this), false);

                this.animate();
            },

            start: function() {
                if(this.isStarted) return;
                this.isStarted = true;

                const intro = document.getElementById('intro-container');
                const card = document.getElementById('main-card');
                
                card.classList.add('hide');
                this.labelManager.activate();

                setTimeout(() => {
                    intro.style.opacity = "0";
                    intro.style.visibility = "hidden";
                    
                    const hint = document.getElementById('interaction-hint');
                    hint.style.opacity = "1";
                    setTimeout(() => hint.style.opacity = "0", 4000);
                }, 800); 
            },

            openModal: function(word, desc) {
                document.getElementById('modal-title').innerText = word;
                document.getElementById('modal-desc').innerText = desc;
                document.getElementById('modal-container').classList.add('show');
            },

            closeModal: function() {
                document.getElementById('modal-container').classList.remove('show');
            },

            onWindowResize: function() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            },

            animate: function() {
                requestAnimationFrame(this.animate.bind(this));
                const elapsedTime = this.clock.getElapsedTime();

                this.interaction.update();
                this.galaxyCore.update(elapsedTime);
                this.labelManager.update(elapsedTime);
                this.mariaHearts.update(elapsedTime); // Atualização frame-a-frame adicionada

                this.renderer.render(this.scene, this.camera);
            }
        };

        window.onload = () => {
            App.init();
        };
    </script>
</body>
</html>
